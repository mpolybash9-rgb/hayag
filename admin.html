<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f8fafc;--card:#fff;--border:#e2e8f0;--text:#1e293b;--muted:#64748b;--primary:#006b3f;--primary-light:#ecfdf5;--danger:#dc2626;--danger-light:#fef2f2;--warning:#f59e0b;--warning-light:#fffbeb;--success:#16a34a;--radius:12px}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;width:100%;max-width:380px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-box h1{font-size:18px;text-align:center;margin-bottom:6px}
.login-box p{text-align:center;color:var(--muted);font-size:13px;margin-bottom:20px}
.login-box .logo{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#00a65a);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-size:24px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px}
.field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-size:14px;outline:none;transition:border .2s}
.field input:focus{border-color:var(--primary)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:12px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{width:auto;padding:6px 14px;font-size:12px;border-radius:8px}
.error{background:var(--danger-light);color:var(--danger);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;margin-bottom:12px;text-align:center}

.dashboard{display:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:12px 16px}
.topbar-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:15px}
.topbar .user-info{font-size:12px;color:var(--muted)}
.topbar .spacer{flex:1}
.topbar .btn-logout{padding:6px 14px;font-size:12px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-weight:600}
.topbar .btn-logout:hover{background:#f1f5f9}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;max-width:1200px;margin:16px auto;padding:0 16px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .num{font-size:28px;font-weight:800;color:var(--primary)}
.stat-card .label{font-size:12px;color:var(--muted);margin-top:4px}

.tabs{display:flex;gap:8px;max-width:1200px;margin:16px auto 0;padding:0 16px;flex-wrap:wrap}
.tab{padding:8px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

.panel{max-width:1200px;margin:12px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.card-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card-body{padding:16px}

.visit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1f5f9}
.visit-item:last-child{border:none}
.visit-dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0}
.visit-info{flex:1;min-width:0}
.visit-info .name{font-size:13px;font-weight:600}
.visit-info .page{font-size:11px;color:var(--muted)}
.visit-time{font-size:11px;color:var(--muted);white-space:nowrap}

.user-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f1f5f9}
.user-item:last-child{border:none}
.user-name{font-size:13px;font-weight:600}
.user-role{font-size:11px;color:var(--muted)}
.btn-del{width:30px;height:30px;border-radius:8px;border:none;background:var(--danger-light);color:var(--danger);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.btn-del:hover{background:var(--danger);color:#fff}

.create-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.create-form input{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.create-form input:focus{border-color:var(--primary)}
.create-form .full{grid-column:1/-1}

.empty{text-align:center;padding:32px;color:var(--muted);font-size:13px}
.loading{text-align:center;padding:24px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
.badge-success{background:var(--primary-light);color:var(--primary)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2)}

@media(max-width:600px){
  .stats{grid-template-columns:1fr 1fr}
  .create-form{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- Login Screen -->
<div class="login-wrap" id="loginScreen">
  <div class="login-box">
    <div class="logo">🔒</div>
    <h1>لوحة التحكم</h1>
    <p>سجّل الدخول للوصول إلى لوحة الإدارة</p>
    <div id="loginError" class="error" style="display:none"></div>
    <form id="loginForm">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="loginEmail" placeholder="admin@hayag.app" required>
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" id="loginBtn">تسجيل الدخول</button>
    </form>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboardScreen">
  <div class="topbar">
    <div class="topbar-inner">
      <h1>🏦 لوحة التحكم والمتابعة</h1>
      <span class="user-info" id="userInfo"></span>
      <div class="spacer"></div>
      <button class="btn-logout" id="logoutBtn">تسجيل خروج</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="statVisits">0</div><div class="label">الزيارات</div></div>
    <div class="stat-card"><div class="num" id="statUsers">0</div><div class="label">المستخدمون</div></div>
    <div class="stat-card"><div class="num" id="statToday">0</div><div class="label">زيارات اليوم</div></div>
    <div class="stat-card"><div class="num" id="statAccounts">0</div><div class="label">حسابات فرعية</div></div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="visitors">الزيارات</div>
    <div class="tab" data-tab="accounts">الحسابات الفرعية</div>
  </div>

  <!-- Visitors Panel -->
  <div class="panel" id="panel-visitors">
    <div class="card">
      <div class="card-header">📊 آخر الزيارات <span class="badge badge-success" id="visitCount">0</span></div>
      <div class="card-body" id="visitsList">
        <div class="loading">جاري التحميل...</div>
      </div>
    </div>
  </div>

  <!-- Accounts Panel -->
  <div class="panel" id="panel-accounts" style="display:none">
    <div class="card">
      <div class="card-header">👥 إنشاء حساب مشاهدة فرعي</div>
      <div class="card-body">
        <div id="createError" class="error" style="display:none"></div>
        <div id="createSuccess" style="display:none;background:var(--primary-light);color:var(--primary);padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px"></div>
        <form id="createForm">
          <div class="create-form">
            <input type="text" id="newUsername" placeholder="اسم المستخدم (إنجليزي)" required>
            <input type="text" id="newDisplayName" placeholder="الاسم الظاهر (اختياري)">
            <input type="password" id="newPassword" placeholder="كلمة المرور" class="full" required>
          </div>
          <button type="submit" class="btn btn-primary" id="createBtn">إنشاء حساب</button>
        </form>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-header">📋 الحسابات الحالية <span class="badge badge-success" id="accountCount">0</span></div>
      <div class="card-body" id="accountsList">
        <div class="loading">جاري التحميل...</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://unpzkfulicjsmilqzwsm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4ciTGnntOEw_m1U_Llm2Cw_S8nRGkWE';

let accessToken = null;
let currentUser = null;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

async function sbFetch(endpoint, { method = 'GET', body, auth = true } = {}) {
  const h = { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (auth && accessToken) h['Authorization'] = 'Bearer ' + accessToken;
  const r = await fetch(SUPABASE_URL + endpoint, {
    method, headers: h,
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await r.text();
  try { return { ok: r.ok, status: r.status, data: JSON.parse(text) }; }
  catch { return { ok: r.ok, status: r.status, data: text }; }
}

async function apiFetch(endpoint, { method = 'GET', body } = {}) {
  const h = { 'Content-Type': 'application/json' };
  if (accessToken) h['Authorization'] = 'Bearer ' + accessToken;
  const r = await fetch(endpoint, { method, headers: h, body: body ? JSON.stringify(body) : undefined });
  const text = await r.text();
  try { return { ok: r.ok, data: JSON.parse(text) }; }
  catch { return { ok: r.ok, data: text }; }
}

// --- Auth ---
async function login(email, password) {
  const r = await sbFetch('/auth/v1/token?grant_type=password', {
    method: 'POST', auth: false,
    body: { email, password },
  });
  if (!r.ok) throw new Error(r.data?.error_description || r.data?.msg || 'بيانات غير صحيحة');
  accessToken = r.data.access_token;
  currentUser = r.data.user;
  localStorage.setItem('hayag_token', accessToken);
  localStorage.setItem('hayag_refresh', r.data.refresh_token);
  return r.data;
}

async function refreshSession() {
  const rt = localStorage.getItem('hayag_refresh');
  if (!rt) return false;
  const r = await sbFetch('/auth/v1/token?grant_type=refresh_token', {
    method: 'POST', auth: false,
    body: { refresh_token: rt },
  });
  if (!r.ok) return false;
  accessToken = r.data.access_token;
  currentUser = r.data.user;
  localStorage.setItem('hayag_token', accessToken);
  localStorage.setItem('hayag_refresh', r.data.refresh_token);
  return true;
}

async function checkAdmin() {
  if (!currentUser) return false;
  const r = await sbFetch(`/rest/v1/user_roles?user_id=eq.${currentUser.id}&role=eq.admin&select=role`);
  return r.ok && Array.isArray(r.data) && r.data.length > 0;
}

function logout() {
  accessToken = null;
  currentUser = null;
  localStorage.removeItem('hayag_token');
  localStorage.removeItem('hayag_refresh');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('dashboardScreen').style.display = 'none';
}

// --- Dashboard Data ---
async function loadVisitors() {
  const r = await sbFetch('/rest/v1/visitor_events?select=id,session_id,event_type,page,data,created_at&order=created_at.desc&limit=100');
  const visits = r.ok && Array.isArray(r.data) ? r.data : [];

  document.getElementById('statVisits').textContent = visits.length;
  document.getElementById('visitCount').textContent = visits.length;

  const today = new Date().toISOString().slice(0, 10);
  const todayVisits = visits.filter(v => v.created_at && v.created_at.startsWith(today));
  document.getElementById('statToday').textContent = todayVisits.length;

  const list = document.getElementById('visitsList');
  if (!visits.length) {
    list.innerHTML = '<div class="empty">لا توجد زيارات مسجلة بعد</div>';
    return;
  }

  list.innerHTML = visits.map(v => {
    const time = v.created_at ? new Date(v.created_at).toLocaleString('ar-EG') : '';
    const label = (v.data && v.data.label) || v.session_id || 'زائر';
    const page = v.page || '/';
    return `<div class="visit-item">
      <div class="visit-dot"></div>
      <div class="visit-info">
        <div class="name">${esc(label)}</div>
        <div class="page">${esc(page)} · ${esc(v.event_type || 'visit')}</div>
      </div>
      <div class="visit-time">${esc(time)}</div>
    </div>`;
  }).join('');
}

async function loadAccounts() {
  const r = await apiFetch('/api/admin/users');
  const users = r.ok && Array.isArray(r.data) ? r.data : [];

  document.getElementById('statAccounts').textContent = users.length;
  document.getElementById('statUsers').textContent = users.length;
  document.getElementById('accountCount').textContent = users.length;

  const list = document.getElementById('accountsList');
  if (!users.length) {
    list.innerHTML = '<div class="empty">لا توجد حسابات فرعية</div>';
    return;
  }

  list.innerHTML = users.map(u => `<div class="user-item">
    <div>
      <div class="user-name">${esc(u.display_name || u.username)}</div>
      <div class="user-role">${esc(u.username)} · مشاهدة فقط</div>
    </div>
    <button class="btn-del" onclick="deleteAccount('${u.id}')" title="حذف">✕</button>
  </div>`).join('');
}

async function createAccount(username, password, displayName) {
  const r = await apiFetch('/api/admin/users', {
    method: 'POST',
    body: { username, password, displayName },
  });
  if (!r.ok) throw new Error(r.data?.error || 'فشل إنشاء الحساب');
  return r.data;
}

async function deleteAccount(id) {
  if (!confirm('هل أنت متأكد من حذف هذا الحساب؟')) return;
  const r = await apiFetch(`/api/admin/users/${id}`, { method: 'DELETE' });
  if (r.ok) {
    showToast('تم حذف الحساب');
    loadAccounts();
  } else {
    showToast('فشل حذف الحساب');
  }
}

function esc(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = String(s);
  return d.innerHTML;
}

// --- Tabs ---
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('panel-visitors').style.display = name === 'visitors' ? '' : 'none';
    document.getElementById('panel-accounts').style.display = name === 'accounts' ? '' : 'none';
    if (name === 'accounts') loadAccounts();
  });
});

// --- Login Form ---
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPassword').value;
  const errEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'جاري الدخول...';

  try {
    await login(email, pass);
    const isAdmin = await checkAdmin();
    if (!isAdmin) {
      logout();
      throw new Error('هذا الحساب ليس لديه صلاحيات الإدارة');
    }
    showDashboard();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
    btn.textContent = 'تسجيل الدخول';
  }
});

// --- Create Account Form ---
document.getElementById('createForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('newUsername').value.trim();
  const password = document.getElementById('newPassword').value;
  const displayName = document.getElementById('newDisplayName').value.trim();
  const errEl = document.getElementById('createError');
  const successEl = document.getElementById('createSuccess');
  const btn = document.getElementById('createBtn');

  errEl.style.display = 'none';
  successEl.style.display = 'none';
  btn.disabled = true;

  try {
    const result = await createAccount(username, password, displayName);
    successEl.innerHTML = `<b>تم الإنشاء بنجاح!</b><br>اسم المستخدم: ${esc(username)}<br>كلمة المرور: ${esc(password)}`;
    successEl.style.display = 'block';
    document.getElementById('newUsername').value = '';
    document.getElementById('newPassword').value = '';
    document.getElementById('newDisplayName').value = '';
    loadAccounts();
  } catch (err) {
    errEl.textContent = err.message;
    errEl.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('logoutBtn').addEventListener('click', logout);

function showDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboardScreen').style.display = 'block';
  document.getElementById('userInfo').textContent = currentUser?.email || '';
  loadVisitors();
  loadAccounts();
}

// --- Auto-refresh ---
setInterval(() => {
  if (document.getElementById('dashboardScreen').style.display !== 'none') {
    loadVisitors();
  }
}, 30000);

// --- Init: try to restore session ---
(async () => {
  const restored = await refreshSession();
  if (restored) {
    const isAdmin = await checkAdmin();
    if (isAdmin) {
      showDashboard();
      return;
    }
  }
  document.getElementById('loginScreen').style.display = 'flex';
})();
</script>
</body>
</html>
